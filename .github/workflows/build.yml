name: Jarvis Palmas - gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Descompactar o projeto
        run: |
          unzip -q .github/workflows/jarvis-palmas-projeto.zip
          ls jarvis-clap
      - name: Baixar modelo Vosk pequeno
        working-directory: jarvis-clap
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q m.zip
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          uuidgen > app/src/main/assets/model-en-us/uuid
      - name: Compilar
        working-directory: jarvis-clap
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-palmas-debug-apk
          path: jarvis-clap/app/build/outputs/apk/debug/app-debug.apk
